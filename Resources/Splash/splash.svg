<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
	<defs>
		<!-- Gradient Słońca -->
		<linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#FFD000" />
			<stop offset="100%" stop-color="#FF7A00" />
		</linearGradient>

		<!-- Gradient Promieni -->
		<linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#FFE033" />
			<stop offset="100%" stop-color="#FF9500" />
		</linearGradient>

		<!-- Gradient Chmury -->
		<linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#FFFFFF" />
			<stop offset="65%" stop-color="#E2F1FF" />
			<stop offset="100%" stop-color="#B0D4FF" />
		</linearGradient>

		<!-- Gradient Kropli Deszczu -->
		<linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#38BDF8" />
			<stop offset="100%" stop-color="#0284C7" />
		</linearGradient>
	</defs>

	<g>
		<!-- PROMIENIE SŁOŃCA -->
		<g stroke="url(#rayGrad)" stroke-width="16" stroke-linecap="round">
			<line x1="200" y1="90" x2="200" y2="65" />
			<line x1="271" y1="119" x2="289" y2="101" />
			<line x1="300" y1="190" x2="325" y2="190" />
			<line x1="271" y1="261" x2="289" y2="279" />
			<line x1="129" y1="119" x2="111" y2="101" />
			<line x1="100" y1="190" x2="75" y2="190" />
			<line x1="129" y1="261" x2="111" y2="279" />
		</g>

		<!-- TARCZA SŁOŃCA -->
		<circle cx="200" cy="190" r="70" fill="url(#sunGrad)" />

		<!-- WARSTWA CIENIA POD CHMURĄ -->
		<path d="M 195 220 A 65 65 0 0 1 312 212 A 40 40 0 0 1 350 250 A 45 45 0 0 1 350 340 L 230 340 A 50 50 0 0 1 150 290 A 50 50 0 0 1 195 220 Z" fill="#89B9ED" />

		<!-- GŁÓWNA CHMURA -->
		<path d="M 195 210 A 65 65 0 0 1 312 202 A 40 40 0 0 1 350 240 A 45 45 0 0 1 350 330 L 230 330 A 50 50 0 0 1 150 280 A 50 50 0 0 1 195 210 Z" fill="url(#cloudGrad)" />

		<!-- KROPLA DESZCZU -->
		<path d="M 210 365 C 210 365 193 388 193 400 A 17 17 0 0 0 227 400 C 227 388 210 365 210 365 Z" fill="url(#dropGrad)" />

		<!-- LINIE WIATRU -->
		<g stroke="#94A3B8" stroke-width="8" stroke-linecap="round" fill="none">
			<path d="M 255 375 L 330 375 A 10 10 0 1 0 320 360" />
			<path d="M 275 400 L 340 400 A 10 10 0 1 1 330 415" />
		</g>
	</g>
</svg>